[project]
name = "superkepler"
version = "0.1.0"
description = "Superkepler data warehouse modeling skill with Databricks Genie integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "databricks-sdk>=0.40.0",
]

[project.scripts]
superkepler-genie = "scripts.genie:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
